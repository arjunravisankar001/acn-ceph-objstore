<source>
  @type syslog
  port 514
  bind 0.0.0.0
  tag librenms.syslog
</source>

<match librenms.syslog.**>
  @type loki
  endpoint_url http://localhost:3100
  flush_interval 10s
  labels {"job":"librenms"}
</match>

<match librenms.s3>
  @type s3
  s3_bucket logbucket
  s3_endpoint http://10.0.2.15:80
  s3_region us-east-1
  path logs/librenms/
  buffer_path /var/log/fluentd/librenms-buffer
  flush_interval 5m
  store_as gzip
  aws_key_id foo
  aws_sec_key bar
</match>
